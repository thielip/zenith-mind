# GitHub Actions CI — lint、type-check、test、build（免費層；零付費 SaaS）
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  env-diff:
    name: Deploy env key diff
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: wrangler.toml vs Vercel manifest diff
        run: node scripts/check-env-keys.mjs --diff

  quality:
    name: Lint + TypeScript
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript (tsc --noEmit)
        run: npm run type-check

  test:
    name: Jest unit tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - name: npm test
        run: npm test

  build:
    name: next build
    runs-on: ubuntu-latest
    needs: test
    env:
      SKIP_ENV_VALIDATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  build-cf:
    name: Cloudflare public build (build:cf)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    env:
      SKIP_ENV_VALIDATION: "true"
      CF_PUBLIC_ONLY: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      NEXT_PUBLIC_SITE_URL: https://www.getzenithmind.com
      ADMIN_DEPLOYMENT_URL: https://zenith-mind.vercel.app
      NEXT_PUBLIC_SUPABASE_URL: https://qhutexisyfbclxntgkvx.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder_not_a_real_key
      NEXT_PUBLIC_IMAGE_DELIVERY: supabase-render
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - name: Verify CF build env keys
        run: node scripts/verify-cf-build-env.mjs
      - name: npm run build:cf
        run: npm run build:cf

  audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    needs: secret-scan
    continue-on-error: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm audit --audit-level=high
