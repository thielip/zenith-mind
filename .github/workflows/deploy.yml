# Cloudflare Workers 自動部署（OpenNext public site）
# 觸發：main push、手動 Run workflow、PR 合併至 main
#
# 請在 GitHub Repository → Settings → Secrets and variables → Actions 新增：
#   CLOUDFLARE_API_TOKEN  — Cloudflare API Token（權限：Account Workers Scripts Edit、Workers Assets 等）
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare Account ID（Dashboard 右側摘要）
#
# 若 build:cf 需要額外 env，可再加 Repository Variables（非 secret）或 Secrets。

name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: deploy-cf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy Worker
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Build OpenNext (Cloudflare)
        run: npm run build:cf
        env:
          SKIP_ENV_VALIDATION: "true"
          CF_PUBLIC_ONLY: "1"
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Validate Cloudflare secrets present
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cf-gha-deploy.mjs

      - name: Post-deploy smoke (public health)
        run: |
          curl -fsS --max-time 30 "https://www.getzenithmind.com/api/health/public-data" | grep -q '"health":"ok"'
          curl -fsS -o /dev/null -w "homepage:%{http_code}\n" --max-time 30 "https://www.getzenithmind.com/zh-TW" | grep -q "homepage:200"
