# Cloudflare Workers（OpenNext）— 與 wrangler deploy / GitHub CI 同步
# 敏感值請用 `npx wrangler secret put`，勿寫入此檔。見 .dev.vars.example

name = "zenith-mind"
main = ".open-next/worker.js"
compatibility_date = "2024-12-30"

# Cloudflare Workers「連線 Git」建置（Dashboard Latest build）
[build]
command = "npm run build:cf"
cwd = "."
watch_dir = ["app", "lib", "components", "middleware.ts", "next.config.ts", "open-next.config.ts", "scripts/cf-public-build.mjs"]
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "zenith-mind"

# 可提交 Git 的環境變數（部署時寫入 Worker，不會被清空）
[vars]
# 後台 Vercel 網址（公開站 /admin/* 302 導向；請改為實際 Vercel 網域）
