# Cloudflare Pages（Next.js）建置設定
# 網域 / SSL / Bulk Redirect 請依 cloudflare/DASHBOARD_STEPS.txt 在儀表板完成

name = "zenith-mind"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm ci && npm run build"

[build.environment]
NODE_VERSION = "22"
# 其餘機密與 NEXT_PUBLIC_* 請在 Pages → Settings → Environment variables 設定
